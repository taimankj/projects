<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up</title>
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="header">
      <div>
        <h1>ODIN</h1>
      </div>
      <p>Photo by Halie West on Unsplash</p>
    </div>
    <div class="main">
      <div class="quote">
        <p>
          This is not a real online service! You knwo you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started
        </p>
        <p>You know you want to.</p>
      </div>

      <form id="sign-up" action="" method="post">
        <div class="legend">
          <legend>Let's do this!</legend>
        </div>
        <div class="input-wrapper">
          <div class="input">
            <label>
              FIRST NAME
              <input name="first-name" />
            </label>
            <label>
              EMAIL
              <input type="email" name="mail" />
            </label>
            <label>
              PASSWORD
              <input type="password" name="password" />
            </label>
          </div>
          <div class="input">
            <label>
              LAST NAME
              <input name="last-name" />
            </label>
            <label>
              PHONE NUMBER
              <input type="tel" name="cell" />
            </label>
            <label>
              CONFIRM PASSWORD
              <input type="password" name="confirmed-password" />
            </label>
          </div>
        </div>
      </form>

      <div class="submit">
        <button type="submit" form="sign-up">Create Account</button>
        <p>Already have an account? <a href="fake-login-page.com">Log in</a></p>
      </div>
    </div>
  </body>
</html>

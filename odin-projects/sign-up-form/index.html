<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-Up</title>
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="header">
      <h1>ODIN</h1>
      <p>Photo by Halie West on Unsplash</p>
    </div>
    <div class="main">
      <div class="quote">
        <p>
          This is not a real online service! You knwo you need something like
          this in your life to help you realize your deepest dreams. Sign up now
          to get started
        </p>
        <p>You know you want to.</p>
      </div>

      <form id="sign-up" action="" method="post">
        <h1>Let's do this!</h1>
        <label>
          <input name="first-name" />
          FIRST NAME
        </label>
        <label>
          <input name="last-name" />
          LAST NAME
        </label>
        <label>
          <input type="email" name="mail" />
          EMAIL
        </label>
        <label>
          <input type="tel" name="cell" />
          PHONE NUMBER
        </label>
        <label>
          <input type="password" name="password" />
          PASSWORD
        </label>
        <label>
          <input type="password" name="confirmed-password" />
          CONFIRM PASSWORD
        </label>
      </form>

      <div class="submit">
        <button type="submit" form="sign-up">Create Account</button>
        <p>Already have an account? <a href="fake-login-page.com">Log in</a></p>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link href="./styles.css" rel="stylesheet" />
    <script src="./script.js" defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tac+One&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form>
      <fieldset class="name-input">
        <label for="name">NAME:</label>
        <input type="text" id="name" name="name" required />
      </fieldset>
      <div class="choices">
        <legend>CHOOSE:</legend>
        <div>
          <input type="radio" id="x" name="choice" value="x" checked />
          <label for="x">x</label>
        </div>
        <div>
          <input type="radio" id="o" name="choice" value="o" />
          <label for="o">o</label>
        </div>
      </div>
      <button id="play">Play</button>
    </form>
    <div class="container">
      <div class="game-info">
        <div class="player-wins">
          <span id="player-name"></span>'s Wins: <span id="player-wins">0</span>
        </div>
        <div class="npc-wins">Opponent Wins: <span id="npc-wins">0</span></div>
        <!-- <div class="game-actions">
          <button class="clear">Clear</button>
          <button class="reset">Reset</button>
        </div> -->
      </div>
      <div class="game-board">
        <button class="cell TOP LEFT"></button>
        <button class="cell TOP CENTER"></button>
        <button class="cell TOP RIGHT"></button>
        <button class="cell MIDDLE LEFT"></button>
        <button class="cell MIDDLE CENTER"></button>
        <button class="cell MIDDLE RIGHT"></button>
        <button class="cell BOTTOM LEFT"></button>
        <button class="cell BOTTOM CENTER"></button>
        <button class="cell BOTTOM RIGHT"></button>
      </div>
    </div>
  </body>
</html>

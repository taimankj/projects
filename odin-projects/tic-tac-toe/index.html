<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link href="./styles.css" rel="stylesheet" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <form>
      <fieldset class="name-input">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" />
      </fieldset>
      <div class="choices">
        <legend>Choose:</legend>
        <div>
          <input type="radio" id="x" name="choice" value="x" checked />
          <label for="x">X</label>
        </div>
        <div>
          <input type="radio" id="o" name="choice" value="o" />
          <label for="o">O</label>
        </div>
      </div>
      <button id="play">Play</button>
    </form>
    <div class="container">
      <div class="game-info">
        <div class="player-wins">
          <span id="player-name"></span>'s Wins: <span id="player-wins">0</span>
        </div>
        <div class="npc-wins">Opponent Wins: <span id="npc-wins">0</span></div>
        <div class="game-actions">
          <button class="clear">Clear</button>
          <button class="reset">Reset</button>
        </div>
      </div>
      <div class="game-board">
        <button class="cell TOP LEFT"></button>
        <button class="cell TOP MIDDLE"></button>
        <button class="cell TOP RIGHT"></button>
        <button class="cell MIDDLE LEFT"></button>
        <button class="cell MIDDLE MIDDLE"></button>
        <button class="cell MIDDLE RIGHT"></button>
        <button class="cell BOTTOM LEFT"></button>
        <button class="cell BOTTOM MIDDLE"></button>
        <button class="cell BOTTOM RIGHT"></button>
      </div>
    </div>
  </body>
</html>
